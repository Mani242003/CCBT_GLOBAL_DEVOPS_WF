name: CMO Build Workflow

on:
  workflow_call:
    inputs:
      relno:
        type: string
        required: true
      branchName:   
        required: true
        type: string


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Print release number
        run: echo "Release is ${{ inputs.relno }}"
       
      - name: Checkout App Code
        run: |
          cd /temp/cmosh/sh
          ./checkoutcode-mcmo.sh "${{ inputs.branchName }}" "${{ secrets.GIT_TOKEN }}"

   


    
